name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  all:
    name: Verification Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the same composite contributors run locally; the docs gate is owned
      # by the Documentation Verification job in ci.yml.
      - name: Static checks (lint, format, type tests, typecheck)
        run: pnpm check

      - name: Build (tsdown)
        run: pnpm build

      - name: Runtime tests and coverage
        run: pnpm test:coverage

      - name: Benchmark gate and coverage contract
        run: pnpm bench:ci

      - name: Upload coverage (Codecov)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
